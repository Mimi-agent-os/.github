name: Idea
description: Propose a change or a new feature. Agree on it here before any pull request.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: The proposal
      description: What you would change and how it would look to someone using it. Say if you would like to write the pull request yourself.
    validations:
      required: true
